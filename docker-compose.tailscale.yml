# Servidor no seu PC, alcancavel pela tailnet. Resolve CGNAT sem depender
# do provedor e sem redirecionar porta nenhuma no roteador.
#
#   .\preparar-tailscale.ps1      (uma vez, gera cert e mostra os valores)
#   docker compose -f docker-compose.tailscale.yml up -d
#
# Teto para os logs. O driver json-file do Docker nao tem limite nenhum por
# padrao: o LiveKit sozinho escreve ~13 MB por dia so com a sala parada, e
# isso cresceria pra sempre dentro do disco virtual. 10 MB x 3 arquivos por
# container e historico de sobra pra investigar qualquer coisa.
x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *log
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/Caddyfile.tailscale:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      # Instalador e latest.yml que o app baixa ao abrir. Somente leitura:
      # o Caddy nunca precisa escrever aqui, quem publica e o publicar.ps1.
      - ./atualizacoes:/updates:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server, livekit]

  livekit:
    image: livekit/livekit-server:v1.9.12
    restart: unless-stopped
    logging: *log
    # --node-ip e o que faz o LiveKit anunciar o endereco da tailnet
    command: --config /etc/livekit.yaml --node-ip ${TAILSCALE_IP}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./infra/livekit.tailscale.yaml:/etc/livekit.yaml:ro
    ports:
      - "7882:7882/udp"
      - "7881:7881/tcp"

  # O ingress do LiveKit (WHIP, pra transmitir pelo OBS) e o redis que ele
  # exigia sairam em 03/09/2026 junto com a opcao de OBS no app: a ideia era
  # boa, mas ninguem usava, e os dois containers ficavam de pe o tempo todo.
  # Pra trazer de volta, ver a memoria "obs-removido".

  server:
    build: ./server
    restart: unless-stopped
    logging: *log
    env_file: .env
    environment:
      DB_PATH: /data/disc.db
    volumes:
      - server_data:/data

volumes:
  caddy_data:
  caddy_config:
  server_data:
