# Ambiente de teste local. Roda o MESMO codigo de servidor que vai pra VM,
# mas sem Caddy e sem TLS: em localhost o Chromium ja trata como contexto
# seguro, entao getDisplayMedia e WebRTC funcionam sem certificado.
#
#   docker compose -f docker-compose.local.yml up -d
#
# Teto para os logs. O driver json-file do Docker nao tem limite nenhum por
# padrao: o LiveKit sozinho escreve ~13 MB por dia so com a sala parada, e
# isso cresceria pra sempre dentro do disco virtual. 10 MB x 3 arquivos por
# container e historico de sobra pra investigar qualquer coisa.
x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    logging: *log
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "devkey: devsecret_apenas_local_nao_use_em_producao"
    volumes:
      - ./infra/livekit.local.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880/tcp"
      - "7882:7882/udp"

  server:
    build: ./server
    restart: unless-stopped
    logging: *log
    env_file: .env.local
    environment:
      DB_PATH: /data/disc.db
    ports:
      - "3000:3000"
    volumes:
      - local_data:/data

volumes:
  local_data:
