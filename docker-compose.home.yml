# Hospedagem caseira: notebook em casa, atras de um roteador domestico.
#
# Diferenca pro docker-compose.yml (nuvem): entra o atualizador de DuckDNS.
# IP residencial muda sozinho, e sem isso o dominio aponta pro vazio depois
# de um tempo - o app simplesmente para de conectar sem erro claro.
#
#   docker compose -f docker-compose.home.yml up -d
#
# Teto para os logs. O driver json-file do Docker nao tem limite nenhum por
# padrao: o LiveKit sozinho escreve ~13 MB por dia so com a sala parada, e
# isso cresceria pra sempre dentro do disco virtual. 10 MB x 3 arquivos por
# container e historico de sobra pra investigar qualquer coisa.
x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Mantem o dominio apontando pro seu IP atual. Checa a cada 5 minutos.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    logging: *log
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ipv4
      TZ: America/Sao_Paulo

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *log
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server, livekit, duckdns]

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    logging: *log
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7882:7882/udp"
      - "7881:7881/tcp"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *log
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data

  ingress:
    image: livekit/ingress:latest
    restart: unless-stopped
    logging: *log
    environment:
      INGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        whip_port: 8080
        rtc_config:
          udp_port: 7885
          use_external_ip: true
    ports:
      - "7885:7885/udp"
    depends_on: [redis, livekit]

  server:
    build: ./server
    restart: unless-stopped
    logging: *log
    env_file: .env
    environment:
      DB_PATH: /data/disc.db
    volumes:
      - server_data:/data

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  server_data:
