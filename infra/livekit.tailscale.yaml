# LiveKit atras do Tailscale.
#
# use_external_ip DESLIGADO de proposito: ligado, ele detectaria o IP publico
# do CGNAT e anunciaria esse endereco como candidato ICE - que ninguem
# consegue alcancar. O IP correto a anunciar e o da tailnet, passado pelo
# --node-ip no docker-compose.
port: 7880

rtc:
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: false

logging:
  level: info

room:
  empty_timeout: 300
  max_participants: 20
