<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSP estrito: sem eval, sem script externo. Mata a maior parte dos vetores de XSS.
         font-src precisa de data: porque o Vite embute as fontes menores como
         data URI no CSS. Sem isso o Inter e o JetBrains Mono sao recusados no
         app empacotado, em silencio, e a tipografia inteira cai pro Segoe UI.

         img-src aceita http://localhost:3000 so por causa do dev: as fotos
         de perfil sao servidas pelo backend, e em desenvolvimento ele e
         http. Em producao a URL e https e ja estaria coberta.

         E aceita blob: porque escolher uma foto passa por
         URL.createObjectURL (ver lib/image.ts): o arquivo local vira uma
         URL blob: pra ser medido e redimensionado antes de subir. Sem isto
         o Chromium recusa a imagem e o upload morre com "nao consegui abrir
         essa imagem", sem dizer que a culpa foi do CSP.

         media-src carrega https: e o localhost do dev pela mesma razao que
         img-src: o audio que alguem manda no chat e servido pelo backend, e
         um <audio> apontando pra la e tratado como midia, nao como imagem.
         Com 'self' sozinho o Chromium recusa e o player fica mudo SEM erro
         nenhum - nem no console, nem no elemento. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http://localhost:3000; media-src 'self' blob: https: http://localhost:3000; connect-src 'self' https: wss:;"
    />
    <title>Disneia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
